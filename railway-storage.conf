# The Railway volume is mounted inside the web root (public/_storage).
# Nothing in it is served except public attachments in media/.
<Directory /var/www/html/public/_storage>
    Require all denied
</Directory>
<Directory /var/www/html/public/_storage/media>
    Require all granted
    <FilesMatch "(?i)\.(php[3-8]?|phar|phtml|pht|phps|htaccess)$">
        Require all denied
    </FilesMatch>
</Directory>
